<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Streak</title>
<style>
  /* ---- Novelist OS · Writing Streak widget ----
     Single file. No external fonts, scripts, or services.
     Data lives in the visitor's own browser (localStorage), so every
     customer who embeds the same URL sees only their own data. ---- */

  :root{
    --ink:        #5b3a26;   /* deep brown, body text         */
    --accent:     #a05a2c;   /* terracotta, strokes + fills   */
    --accent-soft:#c98a5e;   /* lighter terracotta            */
    --line:       #e7d6c7;   /* hairlines, empty cell border  */
    --cell-empty: #f5ece3;   /* unfilled day                  */
    --cell-future:#fbf6f1;   /* days not yet arrived          */
    --card:       #fffdfb;   /* card surface                  */
    --muted:      #9b7d68;   /* secondary labels              */
    --ring:       #6e3f22;   /* today outline                 */
  }

  *{box-sizing:border-box;}
  html,body{margin:0;background:transparent;}
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
    padding:8px;
  }
  .card{
    width:100%; max-width:430px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 22px 16px;
    box-shadow:0 1px 2px rgba(110,63,34,.04), 0 6px 22px rgba(110,63,34,.06);
  }

  /* header */
  .top{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .top svg{width:22px; height:22px; stroke:var(--accent); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
  .title{font-family:Georgia,"Times New Roman",serif; font-size:17px; letter-spacing:.2px; color:var(--ink);}
  .top .spacer{flex:1;}
  .tag{font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted);}

  /* streak number */
  .streakrow{display:flex; align-items:baseline; gap:10px; margin:2px 0 16px;}
  .bignum{font-family:Georgia,serif; font-size:46px; line-height:.9; color:var(--accent); font-weight:400;}
  .biglbl{font-family:Georgia,serif; font-size:15px; color:var(--ink);}
  .flame{width:18px; height:18px; stroke:var(--accent-soft); fill:none; stroke-width:1.5; transform:translateY(2px);}

  /* heatmap */
  .months{display:flex; padding-left:24px; gap:0; margin-bottom:3px; height:13px;}
  .months span{font-size:9.5px; color:var(--muted); flex:0 0 auto;}
  .grid{display:flex; gap:3px;}
  .daycol-labels{display:grid; grid-template-rows:repeat(7,1fr); gap:3px; margin-right:5px;}
  .daycol-labels span{font-size:9px; color:var(--muted); height:15px; line-height:15px; text-align:right; width:18px;}
  .weeks{display:flex; gap:3px;}
  .week{display:grid; grid-template-rows:repeat(7,1fr); gap:3px;}
  .cell{
    width:15px; height:15px; border-radius:4px;
    background:var(--cell-empty); border:1px solid var(--line);
    cursor:pointer; transition:transform .08s ease, background .12s ease;
  }
  .cell:hover{transform:scale(1.18);}
  .cell.on{background:var(--accent); border-color:var(--accent);}
  .cell.future{background:var(--cell-future); border-color:transparent; cursor:default;}
  .cell.future:hover{transform:none;}
  .cell.today{box-shadow:0 0 0 1.5px var(--ring); }

  /* button */
  .btn{
    width:100%; margin:18px 0 12px;
    font-family:Georgia,serif; font-size:14px;
    padding:11px 14px; border-radius:11px;
    border:1.5px solid var(--accent); color:var(--accent);
    background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:background .15s ease, color .15s ease;
  }
  .btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .btn:hover{background:#faf2ea;}
  .btn.done{background:var(--accent); color:#fff; border-color:var(--accent);}

  /* footer */
  .stats{display:flex; justify-content:space-between; border-top:1px solid var(--line); padding-top:11px;}
  .stat{text-align:center; flex:1;}
  .stat b{display:block; font-family:Georgia,serif; font-size:17px; color:var(--ink); font-weight:400;}
  .stat span{font-size:9.5px; letter-spacing:.4px; text-transform:uppercase; color:var(--muted);}

  .actions{display:flex; justify-content:center; gap:14px; margin-top:11px;}
  .actions a{font-size:10px; letter-spacing:.4px; color:var(--muted); cursor:pointer; text-decoration:none; border-bottom:1px dotted var(--line); padding-bottom:1px;}
  .actions a:hover{color:var(--accent);}

  .note{font-size:9.5px; color:var(--accent-soft); text-align:center; margin-top:8px; display:none;}
  .note.show{display:block;}
  input[type=file]{display:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <!-- quill / feather, outlined -->
      <svg viewBox="0 0 24 24"><path d="M20 4C13 5 8 9 5 16l-1 4 4-1c7-3 11-8 12-15z"/><path d="M8.5 15.5c2-3 5-5 8.5-6.5"/></svg>
      <div class="title">Writing Streak</div>
      <div class="spacer"></div>
      <div class="tag">Novelist OS</div>
    </div>

    <div class="streakrow">
      <div class="bignum" id="streak">0</div>
      <div class="biglbl">day<span id="plural">s</span> in a row</div>
      <svg class="flame" viewBox="0 0 24 24"><path d="M12 3c1 4-2 5-2 8a2 2 0 1 0 4 0c0-1 0-1-.3-2 2 1 3.3 3 3.3 5.5a5 5 0 1 1-10 0C7 13 10 11 12 3z"/></svg>
    </div>

    <div class="months" id="months"></div>
    <div class="grid">
      <div class="daycol-labels"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
      <div class="weeks" id="weeks"></div>
    </div>

    <button class="btn" id="checkin">
      <svg id="btnicon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span id="btntext">I wrote today</span>
    </button>

    <div class="stats">
      <div class="stat"><b id="best">0</b><span>Best streak</span></div>
      <div class="stat"><b id="month">0</b><span>This month</span></div>
      <div class="stat"><b id="total">0</b><span>Days total</span></div>
    </div>

    <div class="actions">
      <a id="backup">Backup</a>
      <a id="restore">Restore</a>
      <a id="reset">Reset</a>
      <input type="file" id="file" accept="application/json">
    </div>
    <div class="note" id="note">Private mode is blocking auto-save. Use Backup to keep your data.</div>
  </div>

<script>
(function(){
  "use strict";

  // Set to true ONLY to preview with sample data. Ship with false.
  const DEMO = false;

  const KEY = "novelistOS.writingStreak.v1";
  const WEEKS = 17;            // ~4 months of history shown
  let mem = null;             // in-memory fallback if storage is blocked
  let ephemeral = false;

  // ---------- storage (per-browser, so every customer is isolated) ----------
  function load(){
    try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : {days:{}}; }
    catch(e){ ephemeral = true; return mem || {days:{}}; }
  }
  function save(data){
    try{ localStorage.setItem(KEY, JSON.stringify(data)); }
    catch(e){ mem = data; ephemeral = true; }
    document.getElementById("note").classList.toggle("show", ephemeral);
  }

  // ---------- date helpers (all local time) ----------
  function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function startOfWeek(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-x.getDay()); return x; } // Sunday

  let state = load();
  if (DEMO && Object.keys(state.days).length === 0){
    const t=new Date(); for(let i=0;i<70;i++){ if(i<5 || Math.random()>0.32){ state.days[iso(addDays(t,-i))]=1; } }
  }

  // ---------- metrics ----------
  function isOn(d){ return !!state.days[iso(d)]; }
  function currentStreak(){
    const today=new Date(); today.setHours(0,0,0,0);
    let d = isOn(today) ? today : addDays(today,-1);
    if(!isOn(d)) return 0;
    let n=0; while(isOn(d)){ n++; d=addDays(d,-1); } return n;
  }
  function bestStreak(){
    const keys=Object.keys(state.days).sort(); if(!keys.length) return 0;
    let best=1,run=1;
    for(let i=1;i<keys.length;i++){
      const prev=new Date(keys[i-1]), cur=new Date(keys[i]);
      run = (Math.round((cur-prev)/86400000)===1) ? run+1 : 1;
      if(run>best) best=run;
    }
    return best;
  }
  function thisMonth(){
    const now=new Date(), p=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
    return Object.keys(state.days).filter(k=>k.startsWith(p)).length;
  }

  // ---------- render ----------
  const weeksEl=document.getElementById("weeks");
  const monthsEl=document.getElementById("months");
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function render(){
    const today=new Date(); today.setHours(0,0,0,0);
    const gridStart=addDays(startOfWeek(today), -(WEEKS-1)*7);

    // month labels
    monthsEl.innerHTML=""; let lastMonth=-1;
    for(let w=0; w<WEEKS; w++){
      const colDate=addDays(gridStart, w*7);
      const s=document.createElement("span"); s.style.width="18px";
      if(colDate.getMonth()!==lastMonth){ s.textContent=MON[colDate.getMonth()]; lastMonth=colDate.getMonth(); }
      monthsEl.appendChild(s);
    }

    // cells
    weeksEl.innerHTML="";
    for(let w=0; w<WEEKS; w++){
      const col=document.createElement("div"); col.className="week";
      for(let r=0;r<7;r++){
        const d=addDays(gridStart, w*7+r);
        const c=document.createElement("div"); c.className="cell";
        if(d>today){ c.classList.add("future"); }
        else{
          if(isOn(d)) c.classList.add("on");
          if(d.getTime()===today.getTime()) c.classList.add("today");
          c.title=d.toDateString();
          c.addEventListener("click",()=>{ const k=iso(d); if(state.days[k]) delete state.days[k]; else state.days[k]=1; save(state); render(); });
        }
        col.appendChild(c);
      }
      weeksEl.appendChild(col);
    }

    const cs=currentStreak();
    document.getElementById("streak").textContent=cs;
    document.getElementById("plural").textContent=cs===1?"":"s";
    document.getElementById("best").textContent=bestStreak();
    document.getElementById("month").textContent=thisMonth();
    document.getElementById("total").textContent=Object.keys(state.days).length;

    const done=isOn(today);
    const btn=document.getElementById("checkin");
    btn.classList.toggle("done",done);
    document.getElementById("btntext").textContent=done?"Logged today":"I wrote today";
    document.getElementById("btnicon").innerHTML=done?'<path d="M5 13l4 4L19 7"/>':'<path d="M12 5v14M5 12h14"/>';
  }

  // ---------- actions ----------
  document.getElementById("checkin").addEventListener("click",()=>{
    const k=iso(new Date()); if(state.days[k]) delete state.days[k]; else state.days[k]=1; save(state); render();
  });
  document.getElementById("backup").addEventListener("click",()=>{
    const blob=new Blob([JSON.stringify(state)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="writing-streak-backup.json"; a.click(); URL.revokeObjectURL(a.href);
  });
  document.getElementById("restore").addEventListener("click",()=>document.getElementById("file").click());
  document.getElementById("file").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(d&&d.days){ state=d; save(state); render(); } }catch(_){ } };
    rd.readAsText(f); e.target.value="";
  });
  document.getElementById("reset").addEventListener("click",()=>{
    if(confirm("Clear all logged days? This cannot be undone.")){ state={days:{}}; save(state); render(); }
  });

  render();
})();
</script>
</body>
</html>
