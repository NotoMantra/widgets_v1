<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy + Dopamine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root{
    --purple:#6940A5;
    --survival:#10B981;--standard:#7C4DCE;--hyperfocus:#EF6A6A;
    --appetizer:#E9A020;--main-c:#10B981;--side-c:#6D7BE8;--dessert:#E85D9E;

    /* surfaces: translucent so the Notion page shows through */
    --panel:rgba(255,255,255,.46);
    --panel-2:rgba(255,255,255,.16);
    --card:rgba(255,255,255,.52);
    --card-2:rgba(255,255,255,.22);
    --inset:rgba(105,64,165,.045);
    --hi:rgba(255,255,255,.75);

    --stroke:rgba(105,64,165,.20);
    --stroke-2:rgba(105,64,165,.11);
    --rail:rgba(105,64,165,.14);

    --t1:#1C1329;--t2:#4A3D5C;--t3:#8579A0;--t4:#ADA2C2;
    --lift:0 20px 44px -26px rgba(46,20,92,.42);
  }

  /* Notion dark mode — without this the whole widget vanishes */
  @media (prefers-color-scheme:dark){
    :root{
      --panel:rgba(255,255,255,.075);
      --panel-2:rgba(255,255,255,.025);
      --card:rgba(255,255,255,.075);
      --card-2:rgba(255,255,255,.03);
      --inset:rgba(255,255,255,.035);
      --hi:rgba(255,255,255,.10);

      --stroke:rgba(178,146,255,.26);
      --stroke-2:rgba(178,146,255,.14);
      --rail:rgba(178,146,255,.18);

      --t1:#F3EEFC;--t2:#CFC4E4;--t3:#9E92B8;--t4:#7A6F92;
      --lift:0 20px 46px -26px rgba(0,0,0,.75);
    }
  }

  html,body{width:100%;background:transparent}
  body{
    font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:12px;
    /* if the embed is shorter than the content, scroll instead of amputate */
    overflow-y:auto;
  }

  /* ═══════════ SHELL ═══════════ */
  .w{
    position:relative;
    width:100%;max-width:460px;
    display:flex;flex-direction:column;
    padding:20px 20px 14px;
    border-radius:26px;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    backdrop-filter:blur(16px) saturate(1.3);
    -webkit-backdrop-filter:blur(16px) saturate(1.3);
    box-shadow:inset 0 1px 0 var(--hi),var(--lift);
    animation:rise .6s cubic-bezier(.22,1,.36,1) both;
  }
  /* gradient hairline ring, drawn with a mask so it never clips content */
  .w::after{
    content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;
    background:linear-gradient(145deg,rgba(105,64,165,.60),rgba(105,64,165,.06) 38%,rgba(105,64,165,.06) 62%,rgba(232,93,158,.40));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
    pointer-events:none;
  }
  .w::before{
    content:'';position:absolute;inset:1px;border-radius:25px;pointer-events:none;
    background:radial-gradient(120% 70% at 50% -12%,rgba(105,64,165,.13),transparent 62%);
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}

  /* ═══════════ HEADER ═══════════ */
  .hd{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;position:relative;z-index:1}
  .hd-l{display:flex;align-items:center;gap:9px}
  .hd-l svg{width:17px;height:17px;color:var(--purple);opacity:.6}
  @media (prefers-color-scheme:dark){.hd-l svg{color:#B292FF;opacity:.8}}
  .hd-l span{font-size:10px;font-weight:600;letter-spacing:2.6px;text-transform:uppercase;color:var(--t3)}
  #ts{
    font-size:9px;font-weight:500;letter-spacing:.6px;color:var(--t4);
    padding:3px 9px;border-radius:99px;background:var(--inset);
    opacity:0;transform:scale(.9);transition:opacity .4s,transform .4s;
  }
  #ts.on{opacity:1;transform:none}

  /* ═══════════ ENERGY ═══════════ */
  .sel{display:flex;gap:9px;position:relative;z-index:1}
  .o{
    flex:1;min-height:96px;
    border:0;border-radius:17px;cursor:pointer;outline:none;
    font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:linear-gradient(180deg,var(--card),var(--card-2));
    box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--stroke-2),0 8px 18px -14px rgba(46,20,92,.5);
    transition:box-shadow .4s cubic-bezier(.22,1,.36,1),background .4s,transform .18s cubic-bezier(.22,1,.36,1);
  }
  .o[data-m="survival"]{--c:var(--survival);--wash:rgba(16,185,129,.16)}
  .o[data-m="standard"]{--c:var(--standard);--wash:rgba(124,77,206,.17)}
  .o[data-m="hyperfocus"]{--c:var(--hyperfocus);--wash:rgba(239,106,106,.16)}

  .o:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--stroke),0 14px 26px -16px rgba(46,20,92,.55)}
  .o:active{transform:translateY(0) scale(.985)}
  .o:focus-visible{box-shadow:inset 0 1px 0 var(--hi),0 0 0 2px var(--c),0 0 0 5px var(--wash)}
  .o.on{
    background:linear-gradient(180deg,var(--wash),var(--card-2));
    box-shadow:inset 0 1px 0 var(--hi),0 0 0 1.5px var(--c),0 14px 30px -18px var(--c);
  }

  .dt{position:relative;width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.28;transition:opacity .4s,transform .4s cubic-bezier(.22,1,.36,1)}
  .o.on .dt{opacity:1;transform:scale(1.15);box-shadow:0 0 14px var(--c)}
  .o.on .dt::after{
    content:'';position:absolute;inset:-7px;border-radius:50%;border:1px solid var(--c);
    animation:halo 2.6s cubic-bezier(.22,1,.36,1) infinite;
  }
  @keyframes halo{0%{opacity:.55;transform:scale(.75)}70%,100%{opacity:0;transform:scale(1.5)}}

  .lb{font-size:12px;font-weight:400;color:var(--t3);letter-spacing:.3px;transition:color .35s,font-weight .35s}
  .o.on .lb{color:var(--t1);font-weight:600}

  /* ═══════════ QUOTE ═══════════ */
  .qbox{
    position:relative;z-index:1;text-align:center;
    padding:18px 10px 16px;min-height:74px;
    display:flex;align-items:center;justify-content:center;
  }
  .q{
    font-family:'Instrument Serif',serif;font-style:italic;
    font-size:17px;color:var(--t2);line-height:1.45;letter-spacing:.2px;text-wrap:balance;
    opacity:0;transform:translateY(7px);transition:opacity .5s,transform .5s cubic-bezier(.22,1,.36,1);
  }
  .q.on{opacity:1;transform:none}
  .q.hint{font-family:'DM Sans',sans-serif;font-style:normal;font-size:12px;color:var(--t4);letter-spacing:.3px;opacity:1;transform:none}

  /* ═══════════ DOPAMINE ═══════════ */
  .dopa{
    position:relative;z-index:1;
    border-radius:19px;padding:13px 15px 12px;
    background:var(--inset);
    box-shadow:inset 0 0 0 1px var(--stroke-2);
  }
  .dopa-hd{display:flex;align-items:center;justify-content:space-between;padding-bottom:4px}
  .dopa-hd span{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--t4)}

  .track-row{position:relative;height:46px;display:flex;align-items:center;padding:0 7px;touch-action:none;cursor:pointer}
  .track{position:relative;width:100%;height:4px;background:var(--rail);border-radius:99px}
  .track-fill{
    position:absolute;top:0;left:0;height:100%;width:0;border-radius:99px;
    transition:width .4s cubic-bezier(.22,1,.36,1),background .4s;
  }
  .stops{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between}

  .stp{
    position:relative;z-index:2;width:15px;height:15px;padding:0;
    border:2px solid transparent;border-radius:50%;cursor:pointer;outline:none;
    background:var(--c);opacity:.32;
    transition:opacity .35s,transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s,border-color .35s;
  }
  .stp[data-s="0"]{--c:var(--appetizer);--g:rgba(233,160,32,.55)}
  .stp[data-s="1"]{--c:var(--main-c);--g:rgba(16,185,129,.55)}
  .stp[data-s="2"]{--c:var(--side-c);--g:rgba(109,123,232,.55)}
  .stp[data-s="3"]{--c:var(--dessert);--g:rgba(232,93,158,.55)}
  .stp:hover{opacity:.7;transform:scale(1.15)}
  .stp:focus-visible{opacity:1;box-shadow:0 0 0 3px var(--g)}
  .stp.on{opacity:1;transform:scale(1.4);border-color:rgba(255,255,255,.9);box-shadow:0 0 12px var(--g)}
  @media (prefers-color-scheme:dark){.stp.on{border-color:rgba(255,255,255,.55)}}

  .stp-l{
    position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);
    font-size:8px;font-weight:500;letter-spacing:.4px;white-space:nowrap;color:var(--t4);
    transition:color .3s;pointer-events:none;
  }
  .stp.on .stp-l{color:var(--t2)}

  /* pick pill */
  .dpick{
    margin-top:14px;min-height:34px;
    display:flex;align-items:center;justify-content:center;gap:9px;
    padding:8px 10px 8px 13px;border-radius:99px;
    background:linear-gradient(180deg,var(--card),var(--card-2));
    box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--stroke-2);
    opacity:0;transform:translateY(5px);
    transition:opacity .45s,transform .45s cubic-bezier(.22,1,.36,1);
  }
  .dpick.on{opacity:1;transform:none}
  .dpick-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:background .3s,box-shadow .3s}
  .dpick-text{font-size:12.5px;color:var(--t1);letter-spacing:.1px;line-height:1.3}
  .dpick-time{font-size:9px;font-weight:500;color:var(--t4);letter-spacing:.4px;white-space:nowrap}
  .roll{
    margin-left:auto;flex-shrink:0;
    width:24px;height:24px;border:0;border-radius:50%;cursor:pointer;outline:none;
    background:var(--inset);color:var(--t3);font-size:12px;line-height:1;
    display:grid;place-items:center;
    transition:color .3s,background .3s,transform .45s cubic-bezier(.22,1,.36,1);
  }
  .roll:hover{color:var(--t1);background:var(--rail)}
  .roll:focus-visible{box-shadow:0 0 0 2px var(--purple)}
  .roll.spin{transform:rotate(360deg)}

  /* ═══════════ FOOTER ═══════════ */
  .ft{padding-top:11px;text-align:center;position:relative;z-index:1}
  .ft span{font-size:8.5px;font-weight:400;color:var(--t4);letter-spacing:1px}
  kbd{
    font-family:inherit;font-size:8px;font-weight:600;color:var(--t3);
    padding:1px 4px;border-radius:4px;background:var(--inset);box-shadow:0 0 0 1px var(--stroke-2);
  }

  @media (max-width:400px){
    .w{padding:16px 15px 12px;border-radius:22px}
    .sel{gap:7px}
    .o{min-height:84px;border-radius:14px;gap:10px}
    .lb{font-size:11px}
    .q{font-size:15px}
    .qbox{padding:14px 4px 12px;min-height:64px}
    .dpick-text{font-size:11.5px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<div class="w">

  <div class="hd">
    <div class="hd-l">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span>Energy</span>
    </div>
    <span id="ts"></span>
  </div>

  <div class="sel" role="radiogroup" aria-label="Energy mode">
    <button class="o" data-m="survival" role="radio" aria-checked="false"><span class="dt"></span><span class="lb">Survival</span></button>
    <button class="o" data-m="standard" role="radio" aria-checked="false"><span class="dt"></span><span class="lb">Standard</span></button>
    <button class="o" data-m="hyperfocus" role="radio" aria-checked="false"><span class="dt"></span><span class="lb">Hyperfocus</span></button>
  </div>

  <div class="qbox"><span class="q hint" id="q">Pick your energy for today</span></div>

  <div class="dopa">
    <div class="dopa-hd"><span>Dopamine</span></div>

    <div class="track-row" id="trow">
      <div class="track">
        <div class="track-fill" id="tfill"></div>
        <div class="stops">
          <button class="stp" data-s="0" aria-label="Appetizer, 5 minutes"><span class="stp-l">5 min</span></button>
          <button class="stp" data-s="1" aria-label="Main course, 15 to 30 minutes"><span class="stp-l">15 min</span></button>
          <button class="stp" data-s="2" aria-label="Side dish, ambient"><span class="stp-l">ambient</span></button>
          <button class="stp" data-s="3" aria-label="Dessert, treat"><span class="stp-l">treat</span></button>
        </div>
      </div>
    </div>

    <div class="dpick" id="dpick">
      <span class="dpick-dot" id="ddot"></span>
      <span class="dpick-text" id="dtxt"></span>
      <span class="dpick-time" id="dtime"></span>
      <button class="roll" id="dtap" aria-label="Roll another pick">&#8635;</button>
    </div>
  </div>

  <div class="ft"><span>resets gently at midnight &nbsp;&middot;&nbsp; <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> energy &nbsp;<kbd>&larr;</kbd><kbd>&rarr;</kbd> dopamine &nbsp;<kbd>R</kbd> reroll</span></div>

</div>

<script>
/* ═══ QUOTES ═══ */
const EQ={
  survival:[
    "One small thing is still a victory.",
    "Rest is not giving up, it's gathering strength.",
    "You showed up. That already matters.",
    "Protect your peace today. Tomorrow will wait.",
    "Breathing counts. Existing counts. You count.",
    "Even the slowest river reaches the sea.",
    "Surviving is enough on days like these.",
    "Be soft with yourself. The world is loud enough.",
    "Not every day needs to be a masterpiece.",
    "The bravest thing today might be resting.",
    "Some days the win is simply being here.",
    "Low tide always turns. Trust the rhythm.",
    "Grace is doing less and letting that be enough.",
    "A candle doesn't rush to burn. Neither should you.",
    "One gentle step forward. That's all.",
    "Today's quiet work will echo louder than you think.",
    "Tend to yourself the way you'd tend to a friend.",
    "Small flames still give light.",
    "Let today be a whisper, not a shout.",
    "Stillness is its own kind of progress."
  ],
  standard:[
    "Steady hands build lasting things.",
    "Three things done well beat ten done halfway.",
    "You have more than enough for today.",
    "Keep the pace. The rhythm is yours.",
    "Focused calm is a quiet superpower.",
    "Good days are made of small, clear choices.",
    "The middle path carries its own beauty.",
    "Consistency is the gentlest form of ambition.",
    "Move with intention, not urgency.",
    "Today has room for both effort and ease.",
    "Solid ground beneath you. Build from here.",
    "Clarity over chaos. Always.",
    "Trust the pace you've chosen.",
    "Every finished task is a promise kept to yourself.",
    "You don't need to sprint. Just don't stop.",
    "Balance is not standing still. It's moving gracefully.",
    "The quiet hours hold the most honest work.",
    "Do the next right thing, then the next.",
    "There's elegance in simply following through.",
    "Momentum is built one deliberate hour at a time."
  ],
  hyperfocus:[
    "The world outside can wait. Go deep.",
    "This is your sharpest hour. Use every second.",
    "Silence the noise. Become the work.",
    "Channel everything into this single flame.",
    "Depth over breadth. Always.",
    "You were built for stretches like this.",
    "Let focus be your only compass now.",
    "The zone is calling. Don't keep it waiting.",
    "Lock the door. This time is sacred.",
    "Great things are finished in unbroken hours.",
    "Distraction is the thief. Guard your attention.",
    "Flow state is not found. It's chosen.",
    "Dive so deep the surface disappears.",
    "One thing. All of you. Right now.",
    "This is where ordinary becomes extraordinary.",
    "The clock disappears when the work is real.",
    "Sharpen your edge. Cut through everything.",
    "Intensity with intention. That's the sweet spot.",
    "Let the rest of the world blur.",
    "Your focus is the rarest thing in the room."
  ]
};

/* ═══ DOPAMINE ITEMS ═══ */
const DP={
  0:{name:"Appetizer",time:"5 min",items:[
    "Walk around the block","Stretch at your desk","Play one song loud",
    "Doodle something weird","Make a paper airplane","Do 10 jumping jacks",
    "Water a plant","Stand in sunlight for a bit","Rearrange one shelf",
    "Text someone you miss","Smell something nice","Look out the window, really look",
    "Hum your favorite tune","Write one sentence about nothing","Close your eyes and count to 30",
    "Do a quick desk cleanup"
  ]},
  1:{name:"Main Course",time:"15-30 min",items:[
    "Go for a proper walk","Play guitar or any instrument","Listen to a full podcast episode",
    "Sketch or paint something","Cook a small snack from scratch","Read a chapter of a book",
    "Do a 20-minute workout","Write in a journal","Organize one drawer completely",
    "Watch one episode of something good","Take a long shower","Build something with your hands",
    "Call a friend you haven't spoken to","Solve a puzzle","Dance to a full playlist",
    "Explore a new neighborhood on maps"
  ]},
  2:{name:"Side Dish",time:"ambient",items:[
    "Put on a lo-fi playlist","Open a window for fresh air","Light a candle or incense",
    "Change rooms","Put on rain sounds","Brew tea slowly",
    "Tidy desk in the background","Diffuse essential oils","Switch to warm lighting",
    "Put phone in another room","Wear your comfiest clothes","Play nature sounds",
    "Rearrange your workspace","Hit shuffle, let music find you",
    "Turn off one notification source","Create a clean surface somewhere"
  ]},
  3:{name:"Dessert",time:"treat",items:[
    "10 minutes of guilt-free scrolling","Watch one saved YouTube video",
    "Grab your favorite coffee or drink","Text a friend something funny",
    "Online window-shop for 10 min","Play one round of a mobile game",
    "Eat something you love slowly","Browse a bookstore online",
    "Watch a satisfying video compilation","Look at old photos on your phone",
    "Order yourself something small","Read memes for exactly 5 min",
    "Rewatch a favorite scene","Listen to a guilty pleasure song on repeat",
    "Plan a future trip for 10 min","Buy a small treat on the way home"
  ]}
};

const DCOL=['#E9A020','#10B981','#6D7BE8','#E85D9E'];
const K={m:'adhd-e-mode',t:'adhd-e-ts',d:'adhd-e-date',ds:'adhd-d-stop'};
const td=()=>new Date().toISOString().slice(0,10);
const $=id=>document.getElementById(id);
let curDopa=-1, lastItem='';

function dayIdx(mode){
  let h=0;const s=td()+mode;
  for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}
  return Math.abs(h)%EQ[mode].length;
}

/* ═══ ENERGY ═══ */
function pick(mode){
  document.querySelectorAll('.o').forEach(b=>{
    const on=b.dataset.m===mode;
    b.classList.toggle('on',on);
    b.setAttribute('aria-checked',on);
  });

  const el=$('q');
  el.classList.remove('on');
  setTimeout(()=>{
    el.classList.remove('hint');
    el.textContent=EQ[mode][dayIdx(mode)];
    el.classList.add('on');
  },110);

  try{
    localStorage.setItem(K.m,mode);
    localStorage.setItem(K.t,Date.now());
    localStorage.setItem(K.d,td());
  }catch(e){}
  stamp();
}

/* ═══ DOPAMINE ═══ */
function dopaPick(idx,roll){
  if(idx<0||idx>3)return;
  const changed=idx!==curDopa;
  curDopa=idx;

  document.querySelectorAll('.stp').forEach(s=>s.classList.toggle('on',+s.dataset.s===idx));

  const fill=$('tfill');
  fill.style.width=(idx/3*100)+'%';
  fill.style.background='linear-gradient(90deg,'+DCOL[0]+','+DCOL[idx]+')';

  if(changed||roll!==false)rollItem(idx);
  try{localStorage.setItem(K.ds,idx)}catch(e){}
}

function rollItem(idx){
  const items=DP[idx].items;
  let item=items[Math.floor(Math.random()*items.length)];
  if(items.length>1){
    let guard=0;
    while(item===lastItem&&guard++<8)item=items[Math.floor(Math.random()*items.length)];
  }
  lastItem=item;

  const pk=$('dpick');
  pk.classList.remove('on');
  setTimeout(()=>{
    $('ddot').style.background=DCOL[idx];
    $('ddot').style.boxShadow='0 0 8px '+DCOL[idx];
    $('dtxt').textContent=item;
    $('dtime').textContent=DP[idx].time;
    pk.classList.add('on');
  },90);
}

function reroll(){
  if(curDopa<0)return;
  const b=$('dtap');
  b.classList.add('spin');
  setTimeout(()=>b.classList.remove('spin'),480);
  rollItem(curDopa);
}

/* ═══ LEVER: click or drag anywhere on the rail ═══ */
function nearestStop(clientX){
  const row=$('trow'),r=row.getBoundingClientRect(),pad=7;
  const usable=r.width-pad*2;
  const pct=Math.min(1,Math.max(0,(clientX-r.left-pad)/usable));
  return Math.round(pct*3);
}
(function lever(){
  const row=$('trow');let down=false,moved=-1;
  row.addEventListener('pointerdown',e=>{
    down=true;row.setPointerCapture(e.pointerId);
    moved=nearestStop(e.clientX);dopaPick(moved);
  });
  row.addEventListener('pointermove',e=>{
    if(!down)return;
    const i=nearestStop(e.clientX);
    if(i!==moved){moved=i;dopaPick(i);}
  });
  row.addEventListener('pointerup',()=>{down=false});
  row.addEventListener('pointercancel',()=>{down=false});
})();

/* ═══ TIMESTAMP ═══ */
function stamp(){
  let raw;try{raw=localStorage.getItem(K.t)}catch(e){}
  const el=$('ts');
  if(!raw){el.classList.remove('on');return}
  const diff=Date.now()-parseInt(raw);
  const mi=Math.floor(diff/60000),hr=Math.floor(diff/3600000);
  let s='just now';
  if(hr>=24)s=Math.floor(hr/24)+'d ago';
  else if(hr>=1)s=hr+'h ago';
  else if(mi>=1)s=mi+'m ago';
  el.textContent=s;el.classList.add('on');
}

/* ═══ MIDNIGHT ═══ */
function midnight(){
  let sv;try{sv=localStorage.getItem(K.d)}catch(e){}
  if(sv&&sv!==td()){
    try{localStorage.removeItem(K.m);localStorage.removeItem(K.d);localStorage.removeItem(K.ds)}catch(e){}
    document.querySelectorAll('.o').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-checked','false')});
    document.querySelectorAll('.stp').forEach(s=>s.classList.remove('on'));
    const q=$('q');q.classList.remove('on');q.classList.add('hint');q.textContent='Pick your energy for today';
    $('dpick').classList.remove('on');
    $('tfill').style.width='0';
    curDopa=-1;stamp();return true;
  }
  return false;
}

/* ═══ WIRING ═══ */
document.querySelectorAll('.o').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.m)));
document.querySelectorAll('.stp').forEach(s=>s.addEventListener('click',e=>{e.stopPropagation();dopaPick(+s.dataset.s)}));
$('dtap').addEventListener('click',reroll);

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  const modes=['survival','standard','hyperfocus'];
  if(e.key>='1'&&e.key<='3'){pick(modes[+e.key-1]);e.preventDefault();}
  else if(e.key==='ArrowRight'){dopaPick(curDopa<0?0:Math.min(3,curDopa+1));e.preventDefault();}
  else if(e.key==='ArrowLeft'){dopaPick(curDopa<0?0:Math.max(0,curDopa-1));e.preventDefault();}
  else if(e.key==='r'||e.key==='R'){reroll();}
});

/* ═══ INIT ═══ */
(function(){
  midnight();
  let sv;try{sv=localStorage.getItem(K.m)}catch(e){}
  if(sv&&EQ[sv])pick(sv);

  let ds;try{ds=localStorage.getItem(K.ds)}catch(e){}
  if(ds!==null&&ds!==undefined&&ds!=='')dopaPick(parseInt(ds));

  stamp();
  setInterval(stamp,60000);
  setInterval(midnight,30000);
})();
</script>
