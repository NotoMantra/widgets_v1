<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Sprint</title>
<style>
  /* ---- Novelist OS · Writing Sprint timer ----
     One compact control: type any minute count, or nudge with +/-.
     Survives Notion navigation via an absolute end-time. localStorage
     carries run state, preferred length, today's count, and mute. ---- */
  :root{
    --ink:#5b3a26; --accent:#a05a2c; --accent-soft:#c98a5e;
    --line:#e7d6c7; --track:#f0e3d7; --card:#fffdfb; --muted:#9b7d68;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:transparent;}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:8px;}
  .card{width:100%;max-width:430px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px 18px;box-shadow:0 1px 2px rgba(110,63,34,.04),0 6px 22px rgba(110,63,34,.06);}

  .top{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .top svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .title{font-family:Georgia,"Times New Roman",serif;font-size:17px;color:var(--ink);}
  .spacer{flex:1;}
  .tag{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}

  .ring-wrap{position:relative;width:188px;height:188px;margin:14px auto 6px;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .track{fill:none;stroke:var(--track);stroke-width:9;}
  .prog{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .35s linear;}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .time{font-family:Georgia,serif;font-size:46px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
  .phase{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:7px;}

  .setter{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 2px;}
  .step{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--accent);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .14s ease;}
  .step:hover{border-color:var(--accent);background:#faf2ea;}
  .setter input{width:54px;font-family:Georgia,serif;font-size:16px;text-align:center;padding:5px 4px;border:1.5px solid var(--line);border-radius:9px;background:transparent;color:var(--ink);outline:none;}
  .setter input:focus{border-color:var(--accent-soft);}
  .setter .unit{font-size:11px;color:var(--muted);letter-spacing:.4px;}
  .setter.locked{opacity:.4;pointer-events:none;}

  .controls{display:flex;gap:10px;margin:16px 0 12px;}
  .btn{flex:1;font-family:Georgia,serif;font-size:14px;padding:11px;border-radius:11px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s ease,color .15s ease;}
  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .btn.primary.run{background:var(--accent);color:#fff;}
  .btn:hover{background:#faf2ea;}
  .btn.primary.run:hover{background:#8f4f26;}
  .btn.ghost{flex:0 0 auto;width:46px;border-color:var(--line);color:var(--muted);}
  .btn.ghost:hover{color:var(--accent);border-color:var(--accent-soft);background:transparent;}

  .foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:11px;}
  .today{font-size:11px;color:var(--muted);}
  .today b{font-family:Georgia,serif;color:var(--ink);font-size:14px;font-weight:400;}
  .mute{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.4px;color:var(--muted);cursor:pointer;}
  .mute svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M9 2h6M18 6l1.5-1.5"/></svg>
      <div class="title">Writing Sprint</div>
      <div class="spacer"></div>
      <div class="tag">Novelist OS</div>
    </div>

    <div class="ring-wrap">
      <svg width="188" height="188" viewBox="0 0 188 188">
        <circle class="track" cx="94" cy="94" r="84"></circle>
        <circle class="prog" id="prog" cx="94" cy="94" r="84"></circle>
      </svg>
      <div class="center">
        <div class="time" id="time">25:00</div>
        <div class="phase" id="phase">Ready</div>
      </div>
    </div>

    <div class="setter" id="setter">
      <button class="step" id="minus" aria-label="Less time">&minus;</button>
      <input id="cmin" type="number" min="1" max="240" value="25" aria-label="Minutes">
      <span class="unit">min</span>
      <button class="step" id="plus" aria-label="More time">+</button>
    </div>

    <div class="controls">
      <button class="btn primary" id="start"><svg id="sicon" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg><span id="slabel">Start</span></button>
      <button class="btn ghost" id="reset" title="Reset"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg></button>
    </div>

    <div class="foot">
      <div class="today">Sprints today <b id="count">0</b></div>
      <div class="mute" id="mute"><svg id="micon" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6"/></svg><span id="mlabel">Sound on</span></div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  const KEY="novelistOS.sprint.v1";
  const C=2*Math.PI*84;
  let mem=null;
  const $=id=>document.getElementById(id);

  function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):{}; }catch(e){ return mem||{}; } }
  function persist(){ const data={minutes,muted,today:{date:todayStr(),count},run}; try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){ mem=data; } }
  const todayStr=()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

  let saved=load();
  let minutes=saved.minutes||25;
  let muted=!!saved.muted;
  let count=(saved.today&&saved.today.date===todayStr())?saved.today.count:0;
  let total=minutes*60;
  let run=saved.run||null;
  let remaining=total;
  let interval=null, audioCtx=null, phaseDone=false;

  const prog=$("prog"); prog.style.strokeDasharray=C;

  function armAudio(){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
  function chime(){
    if(muted||!audioCtx) return;
    try{ const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type="sine"; o.frequency.value=660; o.connect(g); g.connect(audioCtx.destination);
      const t=audioCtx.currentTime; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+1.1); o.start(t); o.stop(t+1.15); }catch(e){}
  }

  const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  function paint(){ $("time").textContent=(phaseDone&&run===null)?"Done":fmt(Math.max(0,remaining)); prog.style.strokeDashoffset=C*(1-Math.max(0,remaining)/total); $("count").textContent=count; }
  const setPhase=t=>$("phase").textContent=t;
  function setBtn(m){ const b=$("start"); if(m==="pause"){ b.classList.add("run"); $("slabel").textContent="Pause"; $("sicon").innerHTML='<path d="M8 5v14M16 5v14"/>'; } else { b.classList.remove("run"); $("slabel").textContent=(m==="resume")?"Resume":"Start"; $("sicon").innerHTML='<path d="M7 4l13 8-13 8z"/>'; } }
  function lockSetter(locked){ $("setter").classList.toggle("locked",locked); }

  function startInterval(){ clearInterval(interval); interval=setInterval(()=>{ if(!run||!run.running) return; remaining=Math.round((run.endTime-Date.now())/1000); if(remaining<=0){ complete(false); return; } paint(); },250); }
  function start(){ if(run&&run.running) return; armAudio(); phaseDone=false; const remMs=(run&&!run.running&&run.remainingMs)?run.remainingMs:remaining*1000; run={running:true,endTime:Date.now()+remMs}; persist(); startInterval(); setBtn("pause"); setPhase("Writing"); lockSetter(true); remaining=Math.round(remMs/1000); paint(); }
  function pause(){ if(!run||!run.running) return; clearInterval(interval); const remMs=Math.max(0,run.endTime-Date.now()); run={running:false,remainingMs:remMs}; remaining=Math.round(remMs/1000); persist(); setBtn("resume"); setPhase("Paused"); lockSetter(false); paint(); }
  function reset(){ clearInterval(interval); run=null; phaseDone=false; remaining=total; persist(); setBtn("start"); setPhase("Ready"); lockSetter(false); paint(); }
  function complete(fl){ clearInterval(interval); run=null; remaining=0; phaseDone=true; count++; persist(); setBtn("start"); setPhase("Done"); $("time").textContent="Done"; $("count").textContent=count; prog.style.strokeDashoffset=0; lockSetter(false); if(!fl) chime(); }

  function applyMinutes(m){ m=Math.max(1,Math.min(240,Math.round(m||0))); if(!m) return; minutes=m; total=m*60; clearInterval(interval); run=null; phaseDone=false; remaining=total; $("cmin").value=m; persist(); setBtn("start"); setPhase("Ready"); lockSetter(false); paint(); }

  $("start").addEventListener("click",()=>{ (run&&run.running)?pause():start(); });
  $("reset").addEventListener("click",reset);
  $("minus").addEventListener("click",()=>applyMinutes(minutes-5));
  $("plus").addEventListener("click",()=>applyMinutes(minutes+5));
  $("cmin").addEventListener("change",()=>applyMinutes(parseInt($("cmin").value,10)));
  $("cmin").addEventListener("keydown",e=>{ if(e.key==="Enter"){ applyMinutes(parseInt($("cmin").value,10)); $("cmin").blur(); } });
  $("mute").addEventListener("click",()=>{ muted=!muted; persist(); $("mlabel").textContent=muted?"Sound off":"Sound on"; $("micon").innerHTML=muted?'<path d="M11 5L6 9H3v6h3l5 4zM22 9l-6 6M16 9l6 6"/>':'<path d="M11 5L6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6"/>'; });

  (function init(){
    $("cmin").value=minutes;
    if(muted){ $("mlabel").textContent="Sound off"; $("micon").innerHTML='<path d="M11 5L6 9H3v6h3l5 4zM22 9l-6 6M16 9l6 6"/>'; }
    if(run&&run.running&&run.endTime){
      if(run.endTime>Date.now()){ remaining=Math.round((run.endTime-Date.now())/1000); startInterval(); setBtn("pause"); setPhase("Writing"); lockSetter(true); paint(); }
      else { complete(true); }
    } else if(run&&!run.running&&run.remainingMs){ remaining=Math.round(run.remainingMs/1000); setBtn("resume"); setPhase("Paused"); paint(); }
    else { remaining=total; setBtn("start"); setPhase("Ready"); paint(); }
  })();
})();
</script>
</body>
</html>
